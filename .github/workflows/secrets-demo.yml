name: Secrets demo

on:
  workflow_dispatch:

jobs:
  show:
    runs-on: ubuntu-latest
    steps:
      - name: Use a variable
        run: echo "Site title is ${{ vars.SITE_TITLE }}"
      - name: Use a secret
        env:
          API_KEY: ${{ secrets.DEMO_API_KEY }}
        run: |
          echo "The key is $API_KEY"
          echo "Length: ${#API_KEY} characters"
